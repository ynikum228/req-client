<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REQUIEM.FUN — Private CS2 Software</title>
    <!-- Tailwind CSS (для быстрого подхвата стилей без сборки) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0b0b0e;
        color: #e2e8f0;
      }
      /* Кастомный скроллбар в стиле Midnight */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f1015;
      }
      ::-webkit-scrollbar-thumb {
        background: #262936;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #f97316;
      }
    </style>
  </head>
  <body class="bg-[#0b0b0e] text-gray-200 antialiased selection:bg-orange-500/30 selection:text-orange-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
