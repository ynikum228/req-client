    function AuthModal({ isOpen, onClose, onLoginSuccess }) {
      const [isRegister, setIsRegister] = useState(false);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        const fakeEmail = `${username.toLowerCase().trim()}@gmail.com`;

        try {
          if (isRegister) {
            const { data: authData, error: authErr } = await supabaseClient.auth.signUp({
              email: fakeEmail,
              password: password,
            });

            if (authErr) {
              setError(authErr.message);
              setLoading(false);
              return;
            }

            if (authData.user) {
              const isOwner = username.toLowerCase() === 'morphezy' || username.toLowerCase() === 'morpheus';
              await supabaseClient.from('profiles').insert([{
                id: authData.user.id,
                username: username.trim(),
                role: isOwner ? 'owner' : 'user'
              }]);
              
              onLoginSuccess({ id: authData.user.id, username, role: isOwner ? 'owner' : 'user' });
              onClose();
            }
          } else {
            const { data: authData, error: authErr } = await supabaseClient.auth.signInWithPassword({
              email: fakeEmail,
              password: password,
            });

            if (authErr) {
              setError('Неверный логин или пароль');
              setLoading(false);
              return;
            }

            const { data: profile } = await supabaseClient
              .from('profiles')
              .select('*')
              .eq('id', authData.user.id)
              .single();

            onLoginSuccess(profile || { id: authData.user.id, username, role: 'user' });
            onClose();
          }
        } catch (err) {
          setError('Ошибка подключения к серверу. Отключите VPN/AdBlock или раздайте мобильный интернет.');
        }

        setLoading(false);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">

              <i data-lucide="x" className="w-5 h-5"></i>
            </button>

            <div className="text-center space-y-1">
              <h2 className="text-2xl font-black text-white tracking-wide">{isRegister ? 'СОЗДАТЬ АККАУНТ' : 'АВТОРИЗАЦИЯ'}</h2>
              <p className="text-xs text-gray-400">Введите свои данные для входа в панель REQUIEM</p>
            </div>

            {error && <div className="p-3 bg-red-950/60 border border-red-800 text-red-300 text-xs font-bold rounded-2xl">{error}</div>}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="space-y-1">
                <label className="text-xs font-bold text-gray-400">Логин</label>
                <input 
                  type="text" required value={username} onChange={(e) => setUsername(e.target.value)}
                  className="w-full bg-black/50 border border-white/10 text-xs text-white rounded-2xl p-4 outline-none focus:border-orange-500 transition"
                  placeholder="Введите логин"
                />
              </div>

              <div className="space-y-1">
                <label className="text-xs font-bold text-gray-400">Пароль</label>
                <input 
                  type="password" required value={password} onChange={(e) => setPassword(e.target.value)}
                  className="w-full bg-black/50 border border-white/10 text-xs text-white rounded-2xl p-4 outline-none focus:border-orange-500 transition"
                  placeholder="••••••••"
                />
              </div>

              <button 
                type="submit" disabled={loading}
                className="w-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-black py-4 rounded-2xl text-xs transition-all shadow-xl shadow-orange-600/30 disabled:opacity-50"
              >
                {loading ? 'Загрузка...' : isRegister ? 'Зарегистрироваться' : 'Войти в личный кабинет'}
              </button>
            </form>

            <div className="text-center pt-3 border-t border-white/[0.08]">
              <button onClick={() => setIsRegister(!isRegister)} className="text-xs font-bold text-gray-400 hover:text-orange-400 transition">
                {isRegister ? 'Уже есть аккаунт? Войти' : 'Ещё нет аккаунта? Создать'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ActivateKeyTab({ user, onUpdateUser }) {
      const [keyInput, setKeyInput] = useState('');
      const [status, setStatus] = useState({ type: '', msg: '' });
      const [loading, setLoading] = useState(false);

      const handleActivate = async (e) => {
        e.preventDefault();
        setStatus({ type: '', msg: '' });
        setLoading(true);

        const cleanKey = keyInput.trim();

        try {
          const { data: keyData, error: keyErr } = await supabaseClient
            .from('license_keys')
            .select('*')
            .eq('key_code', cleanKey)
            .single();

          if (keyErr || !keyData) {
            setStatus({ type: 'error', msg: 'Указанный ключ не существует или был введен с ошибкой!' });
            setLoading(false);
            return;
          }

          if (keyData.is_used) {
            setStatus({ type: 'error', msg: 'Этот ключ уже активирован!' });
            setLoading(false);
            return;
          }

          let subUntil = new Date();
          if (keyData.duration_days === -1) {
            subUntil.setFullYear(subUntil.getFullYear() + 100);
          } else {
            subUntil.setDate(subUntil.getDate() + keyData.duration_days);
          }

          await supabaseClient
            .from('license_keys')
            .update({ is_used: true, used_by: user.id })
            .eq('id', keyData.id);

          await supabaseClient
            .from('profiles')
            .update({ subscription_until: subUntil.toISOString() })
            .eq('id', user.id);

          setStatus({ type: 'success', msg: 'Успех! Подписка успешно активирована на вашем аккаунте.' });
          setKeyInput('');
          onUpdateUser();
        } catch (err) {
          setStatus({ type: 'error', msg: 'Ошибка при активации ключа.' });
        }
        setLoading(false);
      };

      return (
        <div className="max-w-xl mx-auto space-y-8 py-6">
          <div className="text-center space-y-2">
            <h1 className="text-3xl font-black text-white">АКТИВАЦИЯ КЛЮЧА</h1>
            <p className="text-xs text-gray-400">Введите ваш 16-значный лицензионный ключ в поле ниже</p>
          </div>

          <form onSubmit={handleActivate} className="glass-card border border-white/10 p-8 rounded-3xl space-y-6 glow-orange">
            {status.msg && (
              <div className={`p-4 rounded-2xl text-xs font-bold ${status.type === 'error' ? 'bg-red-950/60 border border-red-800 text-red-300' : 'bg-emerald-950/60 border border-emerald-800 text-emerald-300'}`}>
                {status.msg}
              </div>
            )}

            <div className="space-y-2">
              <label className="text-xs font-bold text-gray-400">Лицензионный Ключ</label>
              <input 
                type="text" required value={keyInput} onChange={(e) => setKeyInput(e.target.value)}
                placeholder="REQ-XXXX-XXXX-XXXX"
                className="w-full bg-black/60 border border-white/10 text-sm font-mono font-bold text-orange-400 rounded-2xl p-4 outline-none focus:border-emerald-500 uppercase tracking-widest text-center"
              />
            </div>

            <button 
              type="submit" disabled={loading}
              className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-4 rounded-2xl text-xs transition shadow-xl shadow-emerald-600/25 disabled:opacity-50"
            >
              {loading ? 'Проверка...' : 'Активировать Лицензию'}
            </button>
          </form>
        </div>
      );
    }

    function KeygenTab() {
      const [generatedKeys, setGeneratedKeys] = useState([]);
      const [keyDuration, setKeyDuration] = useState('lifetime');
      const [keyAmount, setKeyAmount] = useState(1);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        fetchKeys();
      }, []);

      const fetchKeys = async () => {
        const { data } = await supabaseClient
          .from('license_keys')
          .select('*')
          .order('created_at', { ascending: false });

        if (data) setGeneratedKeys(data);
      };

      const generateLicenseKey = () => {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const segment = () => Array.from({ length: 4 }, () => chars.charAt(Math.floor(Math.random() * chars.length))).join('');
        return `REQ-${segment()}-${segment()}-${segment()}`;
      };

      const handleGenerateKeys = async (e) => {
        e.preventDefault();
        setLoading(true);

        let days = 30;
        if (keyDuration === 'lifetime') days = -1;
        else if (keyDuration === '14_days') days = 14;
        else if (keyDuration === '90_days') days = 90;
        else if (keyDuration === '180_days') days = 180;

        const newKeysToInsert = [];
        for (let i = 0; i < Number(keyAmount); i++) {
          newKeysToInsert.push({
            key_code: generateLicenseKey(),
            duration_days: days,
            is_used: false
          });
        }

        await supabaseClient.from('license_keys').insert(newKeysToInsert);
        fetchKeys();
        setLoading(false);
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto py-4">
          <div className="glass-card border border-purple-900/40 p-6 rounded-3xl flex items-center justify-between">
            <h1 className="text-lg font-black text-white flex items-center gap-3">
              <i data-lucide="cpu" className="text-purple-400 w-5 h-5"></i> Панель Генерации Лицензий (Supabase Admin)
            </h1>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <form onSubmit={handleGenerateKeys} className="glass-card border border-white/10 p-6 rounded-3xl space-y-4">
              <div className="space-y-2">
                <label className="text-xs font-bold text-gray-400">Срок действия</label>
                <select 
                  value={keyDuration}
                  onChange={(e) => setKeyDuration(e.target.value)}
                  className="w-full bg-black/50 border border-white/10 text-xs text-white rounded-xl p-3 outline-none"
                >
                  <option value="14_days">14 Дней</option>
                  <option value="30_days">30 Дней</option>
                  <option value="90_days">90 Дней</option>
                  <option value="180_days">180 Дней</option>
                  <option value="lifetime">Lifetime (Навсегда)</option>
                </select>
              </div>

              <div className="space-y-2">
                <label className="text-xs font-bold text-gray-400">Количество</label>
                <input 
                  type="number" min="1" max="20" value={keyAmount}
                  onChange={(e) => setKeyAmount(e.target.value)}
                  className="w-full bg-black/50 border border-white/10 text-xs text-white rounded-xl p-3 outline-none"
                />
              </div>

              <button 
                type="submit" disabled={loading}
                className="w-full bg-purple-600 hover:bg-purple-500 text-white font-extrabold py-3.5 rounded-xl text-xs transition disabled:opacity-50 shadow-lg shadow-purple-600/30"
              >
                {loading ? 'Создание...' : 'Сгенерировать'}
              </button>
            </form>

            <div className="md:col-span-2 glass-card border border-white/10 p-6 rounded-3xl space-y-4">
              <h3 className="text-xs font-black text-white uppercase tracking-wider">Все созданные ключи ({generatedKeys.length})</h3>
              <div className="space-y-2 max-h-[350px] overflow-y-auto pr-1">
                {generatedKeys.map(k => (
                  <div key={k.id} className="p-3.5 bg-black/40 border border-white/[0.05] rounded-xl flex items-center justify-between text-xs">
                    <span className={`font-mono font-bold ${k.is_used ? 'line-through text-gray-600' : 'text-purple-300'}`}>{k.key_code}</span>
                    <span className={`font-mono text-[10px] font-bold px-2 py-1 rounded-md ${k.is_used ? 'bg-red-950/50 text-red-400' : 'bg-emerald-950/50 text-emerald-400'}`}>
                      {k.is_used ? 'АКТИВИРОВАН' : k.duration_days === -1 ? 'LIFETIME' : `${k.duration_days} ДН.`}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ProfileTab({ user }) {
      return (
        <div className="space-y-6 max-w-3xl mx-auto py-6">
          <div className="glass-card border border-white/10 rounded-3xl p-8 flex items-center gap-6 glow-orange">
            <div className="w-20 h-20 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center text-white text-3xl font-black uppercase shadow-xl shadow-orange-600/30">
              {user.username ? user.username[0] : 'U'}
            </div>
            <div className="space-y-2">
              <div className="flex items-center gap-3">
                <h2 className="text-3xl font-black text-white">{user.username}</h2>
                <span className="text-xs px-3 py-1 rounded-lg border border-orange-500/50 bg-orange-500/20 text-orange-400 font-extrabold uppercase tracking-wider">
                  {user.role || 'USER'}
                </span>
              </div>
              <div className="text-xs font-mono text-gray-400 font-bold">
                Статус подписки: <span className="text-orange-400">{user.subscription_until ? `Активна до ${new Date(user.subscription_until).toLocaleDateString()}` : 'Нет активной подписки'}</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('buy');
      const [user, setUser] = useState(null);
      const [isAuthOpen, setIsAuthOpen] = useState(false);

      const fetchProfile = async (authUser) => {
        if (!authUser) return;
        const { data } = await supabaseClient.from('profiles').select('*').eq('id', authUser.id).single();
        if (data) setUser(data);
      };

      useEffect(() => {
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
          if (session?.user) fetchProfile(session.user);
        });
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, user, isAuthOpen]);

      const handleLogout = async () => {
        await supabaseClient.auth.signOut();
        setUser(null);
        setActiveTab('buy');
      };

      return (
        <div className="min-h-screen bg-[#08080a] text-gray-200 font-sans pb-16">
          <Header 
            activeTab={activeTab} 
            setActiveTab={setActiveTab} 
            user={user} 
            onLogout={handleLogout}
            onOpenAuth={() => setIsAuthOpen(true)}
          />
          
          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
            {activeTab === 'buy' && <BuyTab />}
            {activeTab === 'activate' && user && <ActivateKeyTab user={user} onUpdateUser={() => fetchProfile(user)} />}
            {activeTab === 'keygen' && user && (user.role === 'owner' || user.role === 'admin') && <KeygenTab />}
            {activeTab === 'profile' && user && <ProfileTab user={user} />}
            {activeTab === 'admin' && user && (user.role === 'owner' || user.role === 'admin') && (
              <div className="max-w-3xl mx-auto glass-card border border-amber-500/30 p-8 rounded-3xl text-xs flex justify-between items-center">
                <span className="text-white font-bold text-base">{user.username} ({user.role})</span>
                <span className="text-amber-400 font-black tracking-widest uppercase">Full Owner Root Access</span>
              </div>
            )}
          </main>

          <AuthModal 
            isOpen={isAuthOpen} 
            onClose={() => setIsAuthOpen(false)} 
            onLoginSuccess={(userData) => setUser(userData)} 
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
